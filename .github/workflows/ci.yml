name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      # The writing conventions used to be enforced by whoever read the diff. That
      # works for one author and stops working the moment there are three.
      - name: Conventions
        run: uv run python scripts/check_conventions.py

      - name: Test (pytest)
        run: uv run pytest
