# Render free tier. The service spins down when idle, so the first request after a
# quiet period pays a cold start. That is accepted and documented rather than
# engineered around, but it is load-bearing for the 72 hour trace in BACKLOG M8.1:
# the trace has to survive cold starts rather than assume continuous uptime, and a
# spin-down is not a user-facing failure.
services:
  - type: web
    name: tollgate
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Call the interpreter the build produced rather than going through `uv run`.
    # `uv run` re-resolves and syncs before executing, which on a cold container
    # blows past Render's port-scan window, and it assumes uv is on the runtime
    # PATH, which is not guaranteed just because the build step installed it.
    startCommand: .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ENVIRONMENT
        value: production
      # All set in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
