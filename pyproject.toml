[project]
name = "tollgate"
version = "0.1.0"
description = "OpenAI-compatible gateway over free-tier model providers: budget-aware routing, two-layer caching, and per-request metering."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # No opentelemetry here. Spanlight declares the SDK and the OTLP exporter it
    # needs, and nothing in this repo imports otel directly.
    "spanlight",
    "redis>=8.1.0",
]

# Spanlight is instrumented from the first commit rather than retrofitted. The
# overhead number this project publishes is a decomposition of these spans, and a
# decomposition cannot be added afterwards.
[tool.uv.sources]
# Pinned to a revision, not to a branch. An unpinned git dependency means a build
# today and a build next month can install different code while the lockfile and
# the README both claim otherwise, which breaks the one thing this portfolio sells:
# every number regenerating from a script. It is also the obvious supply-chain
# exposure, since whatever lands on the default branch is what gets executed.
#
# Bump this deliberately, and re-run any published number that depends on tracing.
spanlight = { git = "https://github.com/vinayakjeet/spanlight", rev = "abe44e2b90fa855cb8c7a9c5e9e3bdb97488237b" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Used only to prove the response really parses in the client callers use.
    "openai>=1.0",
]

# Optional groups, not base dependencies, on purpose. The Postgres driver is only
# imported when DATABASE_URL points at a real store, and sentence-transformers
# pulls torch, which no CI run and no mock-provider demo should pay for. A fresh
# clone works from zero without either; `uv sync --group semantic` is the opt-in.
pg = ["psycopg[binary]>=3.1"]
semantic = ["sentence-transformers>=3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
